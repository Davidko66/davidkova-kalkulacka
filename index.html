<!doctype html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d14"><meta name="description" content="Davidkova Kalkulačka – flip, maximálna nákupná cena a servis."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Davidkova Kalkulačka</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090d14;color:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1060px;margin:auto;padding:28px 18px 90px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:38px}.brand small{display:block;letter-spacing:.24em;font-size:10px;color:#8da0bc;font-weight:700}.brand strong{font-size:22px;letter-spacing:-.8px}.mark{background:#182640;color:#74b2ff;padding:12px;border-radius:14px}.intro h1{font-size:clamp(29px,5vw,43px);letter-spacing:-1.5px;margin:0 0 7px}.muted{color:#91a0b6}.intro p{margin:0 0 25px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}.tab{background:#141c2b;border:1px solid #263751;border-radius:17px;color:#f8fafc;text-align:left;padding:18px;transition:.2s}.tab:hover,.tab.active{border-color:#4c92ff;background:#192a43}.tab .emoji{display:block;font-size:23px;margin-bottom:12px}.tab strong{display:block;font-size:15px}.tab span:last-child{display:block;color:#9aa9bf;font-size:12px;margin-top:5px}.panel{background:#111a28;border:1px solid #25354a;border-radius:22px;padding:25px}.panel h2{margin:0 0 7px;font-size:23px;letter-spacing:-.6px}.panel>p{margin:0 0 25px;color:#96a6bd;font-size:14px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;color:#b4c1d4;font-size:13px;margin-bottom:8px}.field .inputwrap{display:flex;align-items:center;background:#0b121e;border:1px solid #34445a;border-radius:12px;overflow:hidden}.field input{background:transparent;border:0;outline:0;color:white;padding:14px;width:100%;min-width:0;font-size:17px;font-variant-numeric:tabular-nums}.field .unit{padding:0 14px;color:#8da0bc}.field input:focus{box-shadow:inset 0 0 0 1px #4c92ff}.results{border-top:1px solid #2a3a4e;margin-top:25px;padding-top:23px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.result{background:#192638;border-radius:14px;padding:17px}.result small{color:#a8b8cc;display:block;margin-bottom:9px;font-size:12px}.result strong{font-size:clamp(19px,3vw,27px);letter-spacing:-.7px;overflow-wrap:anywhere}.good{color:#54e2a1}.bad{color:#ff818d}.blue{color:#77b4ff}.note{color:#8292a9;font-size:12px;margin-top:20px;line-height:1.5}.footer{color:#71839c;font-size:12px;text-align:center;margin-top:27px}.reset{margin-top:18px;border:1px solid #354963;background:transparent;color:#b7c9e0;border-radius:10px;padding:10px 15px}.reset:hover{background:#1c2c43}@media(max-width:600px){.wrap{padding:22px 15px 70px}.top{margin-bottom:32px}.tabs{grid-template-columns:1fr;gap:9px}.tab{padding:13px 15px;display:grid;grid-template-columns:38px 1fr;column-gap:10px;align-items:center}.tab .emoji{grid-row:span 2;margin:0}.tab span:last-child{margin-top:2px}.panel{padding:20px 16px}.fields{gap:13px}.results{grid-template-columns:repeat(2,1fr)}.result:first-child{grid-column:span 2}.result strong{font-size:24px}}@media(max-width:370px){.fields{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><small>DAVIDKOVA</small><strong>Kalkulačka<span class="blue">.</span></strong></div><div class="mark">▦</div></header><section class="intro"><h1>Tvoje nástroje<span class="blue">.</span></h1><p class="muted">Jednoduché výpočty. Lepšie rozhodnutia.</p></section><nav class="tabs" id="tabs" aria-label="Kalkulačky"></nav><section class="panel" id="panel" aria-live="polite"></section><footer class="footer">Davidkova Kalkulačka · v1.0 · Výsledky sú orientačné, pred zdanením.</footer></main><script>
const definitions={flip:{icon:'📱',title:'Flip kalkulačka',description:'Náklady, zisk, marža a ROI.',fields:[['buy','Nákupná cena',470],['repair','Náklady na opravu',100],['other','Ostatné náklady',20],['sell','Predajná cena',700]],calculate:v=>{let costs=v.buy+v.repair+v.other,profit=v.sell-costs;return [['Zisk / strata',profit,'money',profit>=0?'good':'bad'],['Celkové náklady',costs,'money',''],['ROI',costs?profit/costs*100:null,'percent','blue'],['Marža',v.sell?profit/v.sell*100:null,'percent',''],['Bod zvratu',costs,'money','']]}},max:{icon:'🎯',title:'Maximálna nákupná cena',description:'Zisti, koľko môžeš ponúknuť za telefón.',fields:[['sell','Očakávaná predajná cena',700],['repair','Náklady na opravu',100],['other','Ostatné náklady',20],['profit','Požadovaný zisk',100]],calculate:v=>{let max=v.sell-v.repair-v.other-v.profit;return [['Maximálna nákupná cena',max,'money',max>=0?'good':'bad'],['Rezerva na náklady',v.repair+v.other,'money',''],['Cieľový zisk',v.profit,'money','blue']]}},service:{icon:'🛠️',title:'Servisná kalkulačka',description:'Vypočítaj cenu opravy pre zákazníka.',fields:[['parts','Cena dielov',45],['material','Ostatný materiál',5],['labor','Cena práce',25],['reserve','Rezerva / ďalší zisk',10]],calculate:v=>{let direct=v.parts+v.material,total=direct+v.labor+v.reserve;return [['Cena pre zákazníka',total,'money','blue'],['Priame náklady',direct,'money',''],['Práca + rezerva',v.labor+v.reserve,'money','good']]}}};
const state={};for(const [key,def] of Object.entries(definitions))state[key]=Object.fromEntries(def.fields.map(([id,,value])=>[id,value]));let current='flip';const money=n=>new Intl.NumberFormat('sk-SK',{style:'currency',currency:'EUR'}).format(n),percent=n=>n===null?'—':new Intl.NumberFormat('sk-SK',{maximumFractionDigits:1}).format(n)+' %';const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderTabs(){document.querySelector('#tabs').innerHTML=Object.entries(definitions).map(([key,d])=>`<button type="button" class="tab ${key===current?'active':''}" data-tab="${key}" aria-pressed="${key===current}"><span class="emoji">${d.icon}</span><strong>${d.title}</strong><span>${d.description}</span></button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{current=b.dataset.tab;render()}))}function updateResults(){const d=definitions[current],results=d.calculate(state[current]);document.querySelector('#results').innerHTML=results.map(([name,value,kind,color])=>`<div class="result"><small>${escapeHTML(name)}</small><strong class="${color}">${kind==='money'?money(value):percent(value)}</strong></div>`).join('')}function render(){renderTabs();let d=definitions[current];document.querySelector('#panel').innerHTML=`<h2>${d.title}</h2><p>${d.description}</p><div class="fields">${d.fields.map(([id,label])=>`<div class="field"><label for="${id}">${label}</label><div class="inputwrap"><input id="${id}" type="number" min="0" step="0.01" inputmode="decimal" value="${state[current][id]}"><span class="unit">€</span></div></div>`).join('')}</div><div class="results" id="results"></div><button type="button" class="reset" id="reset">↺ Obnoviť hodnoty</button><div class="note">Výsledky nezahŕňajú dane, prípadné poplatky platforiem ani ďalšie neuvedené výdavky. Servisná cena je orientačná a nezahŕňa automatický výpočet DPH.</div>`;d.fields.forEach(([id])=>document.getElementById(id).addEventListener('input',e=>{state[current][id]=Math.max(0,Number(e.target.value)||0);updateResults()}));document.getElementById('reset').addEventListener('click',()=>{state[current]=Object.fromEntries(d.fields.map(([id,,value])=>[id,value]));render()});updateResults()}render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
